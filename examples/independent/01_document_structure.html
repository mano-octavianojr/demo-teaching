<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document structure</title>
</head>
<body>
  <!-- The doctype selects standards mode. The head describes the page; body holds its content. -->
  <h1>My first HTML document</h1>
  <p>The browser tab shows the title. The page shows the body.</p>
</body>
</html>
