<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists</title>
</head>
<body>
  <!-- ul is unordered; ol is ordered. Each item is an li element. -->
  <main>
    <h1>Skills and learning steps</h1>
    <h2>Skills</h2>
    <ul>
      <li>Writing HTML</li>
      <li>Checking links</li>
    </ul>
    <h2>Practice steps</h2>
    <ol>
      <li>Edit the file.</li>
      <li>Save it.</li>
      <li>Refresh the browser.</li>
    </ol>
  </main>
</body>
</html>
