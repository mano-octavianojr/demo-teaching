<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images and alternative text</title>
</head>
<body>
  <!-- img is a void element: it has no closing tag. alt describes this meaningful image. -->
  <main>
    <h1>Our college emblem</h1>
    <img src="assets/college-logo.png" width="240" height="129"
         alt="De La Salle University and College of Computer Studies emblems">
    <p>The logo is a local file, so no internet connection is needed.</p>
  </main>
</body>
</html>
