<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headings and paragraphs</title>
</head>
<body>
  <!-- Use headings for hierarchy. strong marks importance; em marks stress emphasis. -->
  <main>
    <h1>Maya Santos</h1>
    <p>A fictional computing student.</p>
    <h2>About me</h2>
    <p>I am learning <strong>semantic HTML</strong>.</p>
    <p>I want my pages to be <em>easy to understand</em>.</p>
  </main>
</body>
</html>
