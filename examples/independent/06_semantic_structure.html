<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic page structure</title>
</head>
<body>
  <!-- These elements describe content roles; CSS controls their visual layout. -->
  <header>
    <h1>Maya's portfolio</h1>
    <p>A learning portfolio with fictional content.</p>
  </header>
  <nav aria-label="Page sections">
    <a href="#projects">Projects</a>
  </nav>
  <main>
    <section id="projects">
      <h2>Projects</h2>
      <article>
        <h3>Campus study guide</h3>
        <p>A self-contained description of a student project.</p>
      </article>
    </section>
  </main>
  <footer>
    <p>Created while learning HTML.</p>
  </footer>
</body>
</html>
