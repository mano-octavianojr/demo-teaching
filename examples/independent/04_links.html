<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links and anchors</title>
</head>
<body>
  <!-- Fragment links work offline. Each href fragment must match a unique id. -->
  <header>
    <h1>Maya's learning page</h1>
  </header>
  <nav aria-label="Page sections">
    <a href="#projects">Explore my projects</a>
  </nav>
  <main>
    <section id="about">
      <h2>About</h2>
      <p>I am building my first portfolio.</p>
    </section>
    <section id="projects">
      <h2>Projects</h2>
      <p>My campus guide is my first project.</p>
      <p><a href="#about">Return to About</a></p>
    </section>
  </main>
</body>
</html>
